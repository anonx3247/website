<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440">
  <defs>
    <radialGradient id="bg-m" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a76a"/>
    </marker>
  </defs>

  <rect width="440" height="440" fill="url(#bg-m)"/>

  <!-- faint grid of weight-matrix cells -->
  <g stroke="#ffffff" stroke-opacity="0.04" fill="none">
    <line x1="60" y1="80" x2="180" y2="80"/>
    <line x1="60" y1="120" x2="180" y2="120"/>
    <line x1="60" y1="160" x2="180" y2="160"/>
    <line x1="100" y1="40" x2="100" y2="200"/>
    <line x1="140" y1="40" x2="140" y2="200"/>
  </g>

  <!-- causal-state chain: states along a horizontal timeline -->
  <g stroke="#c9a76a" stroke-opacity="0.5" fill="none">
    <line x1="150" y1="220" x2="300" y2="220" marker-end="url(#arrow-m)"/>
    <line x1="300" y1="220" x2="360" y2="130" marker-end="url(#arrow-m)"/>
    <line x1="150" y1="220" x2="90" y2="130" marker-end="url(#arrow-m)"/>
    <line x1="90" y1="130" x2="150" y2="60" marker-end="url(#arrow-m)"/>
    <line x1="360" y1="130" x2="300" y2="60" marker-end="url(#arrow-m)"/>
    <line x1="300" y1="220" x2="240" y2="300" marker-end="url(#arrow-m)"/>
    <line x1="150" y1="220" x2="90" y2="300" marker-end="url(#arrow-m)"/>
  </g>

  <!-- dormant / secondary states -->
  <g fill="#6a6d76">
    <circle cx="330" cy="70" r="7"/>
    <circle cx="390" cy="320" r="8"/>
    <circle cx="60" cy="320" r="7"/>
    <circle cx="200" cy="380" r="6"/>
    <circle cx="390" cy="80" r="6"/>
  </g>

  <!-- primary causal states -->
  <g fill="#c9a76a">
    <circle cx="150" cy="220" r="15"/>
    <circle cx="300" cy="220" r="13"/>
  </g>
  <g fill="#a9894d">
    <circle cx="90" cy="130" r="10"/>
    <circle cx="360" cy="130" r="10"/>
    <circle cx="300" cy="60" r="9"/>
    <circle cx="150" cy="60" r="9"/>
  </g>
  <g fill="#8a6e3b">
    <circle cx="240" cy="300" r="8"/>
    <circle cx="90" cy="300" r="9"/>
  </g>

  <!-- label -->
  <text x="220" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#9a9da6" letter-spacing="2">ε-MACHINES</text>
</svg>
